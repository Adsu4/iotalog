<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>track BFIOT | Premium IoT Logistics Tracking</title>
    <meta content="Technical Excellence. Track your IoT hardware kits with track BFIOT." name="description" />

    <!-- Style Sheet & Fonts -->
    <link href="index.css?v=1.0.4" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@500&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
</head>

<body>
    <!-- Header -->
    <header>
        <div class="header-wrapper">
            <div class="logo" onclick="resetTracking()">
                <img src="logo.png" alt="track BFIOT" style="height: 38px; display: block; filter: var(--logo-filter); border-radius: 4px;" id="logoImg" />
            </div>
            <div class="header-actions">
                <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle Theme Mode">
                    <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Panel -->
    <main>
        <div class="grid-pattern"
            style="position: absolute; inset: 0; z-index: -10; opacity: 0.6; pointer-events: none;"></div>

        <img alt=""
            style="position: absolute; bottom: -100px; left: -100px; opacity: 0.05; filter: blur(6px); pointer-events: none; z-index: -10; rotate: -15deg; max-width: 450px;"
            src="https://lh3.googleusercontent.com/aida/AP1WRLt_njWJPNANqsuG-ToivanObk6N4dkonuJvoytI8zxBJ_K4py168hH9D2S2-jZpPyl-i5PEbCfFmZqri8CdUqDiebzW6tvbU31kdIQGbVzklu4FvgB_8H_bUXP_Ko3BtUAsM5ZIVQ2tDx7RdbJWGw_w9VO1l68DTtA5mejEzbeH0BD8lD-G1eEEF7ktbWedVE_PoMu3VrxZv_N7dwT5XMCw_w0Z8x94PstV5Wp386jZ_VMa7LMh0g_6o80" />

        <!-- Dashboard Wrapper -->
        <div class="dashboard-container" id="dashboardContainer">

            <!-- Hero Header Info -->
            <section class="hero">
                <div class="live-badge">
                    <span class="dot"></span>
                    <span>Live Logistics Nodes</span>
                </div>
                <h1 class="hero-title">
                    Track your journey <span class="italic">into IoT.</span>
                </h1>
            </section>

            <!-- Search Area -->
            <div class="search-wrapper">
                <div class="search-bg-glow"></div>
                <div class="search-bar">
                    <div class="search-icon-label">
                        <span class="material-symbols-outlined">local_shipping</span>
                    </div>
                    <input class="search-input" id="trackingInput"
                        placeholder="Enter Consignment Number (e.g., BF-ESP32-9876)" type="text" />
                    <button class="btn btn-primary search-button" onclick="performTracking()">
                        Track Now
                        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
                    </button>
                </div>
            </div>



            <!-- Scrollable Timeline Results Card -->
            <section class="results-section" id="trackingResult">
                <div class="results-card">
                    <div class="results-header">
                        <div class="consignment-info">
                            <span class="meta-label">Consignment ID</span>
                            <h2 id="displayConsignment">---</h2>
                        </div>
                        <div class="sync-status">
                            <span class="material-symbols-outlined">sync</span>
                            <span>Live Sync</span>
                        </div>
                    </div>

                    <!-- Cargo Info Details -->
                    <div class="metadata-grid">
                        <div class="metadata-item">
                            <span class="meta-label">Courier</span>
                            <span class="meta-val" id="metaCourier">India Post</span>
                        </div>
                        <div class="metadata-item">
                            <span class="meta-label">Current Status</span>
                            <span class="meta-val" id="metaStatus">---</span>
                        </div>
                        <div class="metadata-item">
                            <span class="meta-label">Weight</span>
                            <span class="meta-val" id="metaWeight">---</span>
                        </div>
                        <div class="metadata-item">
                            <span class="meta-label">Est. Delivery</span>
                            <span class="meta-val" id="metaEstDelivery">---</span>
                        </div>
                    </div>

                    <!-- Scrollable timeline step list -->
                    <div class="results-body">
                        <div class="timeline" id="timelineContainer">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>
            </section>

        </div>

        <div class="footer-credits">
            © 2026 track BFIOT. Technical Excellence for Beginners.
        </div>
    </main>

    <!-- UI Controllers -->
    <script>
        // --- 1. Light & Dark Themes ---
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        function setTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.textContent = 'light_mode';
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.textContent = 'dark_mode';
                localStorage.setItem('theme', 'light');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            setTheme(currentTheme);
        });



        function resetTracking() {
            document.getElementById('trackingInput').value = '';
            document.getElementById('dashboardContainer').classList.remove('results-loaded');
            document.getElementById('trackingResult').classList.remove('show');
        }

        async function performTracking() {
            const input = document.getElementById('trackingInput');
            const result = document.getElementById('trackingResult');
            const container = document.getElementById('dashboardContainer');
            const displayId = document.getElementById('displayConsignment');
            const timelineContainer = document.getElementById('timelineContainer');

            const metaCourier = document.getElementById('metaCourier');
            const metaStatus = document.getElementById('metaStatus');
            const metaWeight = document.getElementById('metaWeight');
            const metaEstDelivery = document.getElementById('metaEstDelivery');

            const trackingNumber = input.value.trim().toUpperCase();

            if (trackingNumber === '') {
                alert('Please enter a consignment number');
                return;
            }

            // Adjust screen state to show results container
            container.classList.add('results-loaded');
            result.classList.add('show');

            displayId.innerText = trackingNumber;
            metaStatus.innerText = 'Synchronizing...';
            metaWeight.innerText = 'Calculating...';
            metaEstDelivery.innerText = 'Pinging...';
            metaCourier.innerText = 'India Post';

            timelineContainer.innerHTML = `
                <div class="loading-wrapper">
                    <div class="spinner"></div>
                    <div class="loading-text">Pinging Tracking Nodes...</div>
                </div>
            `;

            // Call Server API
            try {
                const response = await fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trackingNumber })
                });

                const data = await response.json();

                if (response.ok && data.meta && data.meta.code === 200 && data.data && data.data.origin_info && data.data.origin_info.trackinfo) {
                    const trackInfo = data.data.origin_info.trackinfo;
                    const parsedData = {
                        courier: 'India Post',
                        status: data.data.status || 'In Transit',
                        weight: 'Unknown',
                        estDelivery: 'Unknown',
                        events: trackInfo.map((event, index) => {
                            const eventDate = new Date(event.checkpoint_date || event.Date).toLocaleString('en-IN', {
                                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                            }).toUpperCase();
                            return {
                                time: eventDate,
                                title: event.tracking_detail || event.StatusDescription || 'Event Registered',
                                details: event.location || event.Details || '',
                                current: index === 0,
                                completed: data.data.status === 'delivered'
                            };
                        })
                    };
                    renderTimeline(parsedData);
                } else {
                    showError(data.meta?.message || data.error || 'Failed to sync with tracking network.');
                }
            } catch (error) {
                showError('Network error while connecting to tracking API.');
            }
        }

        function renderTimeline(data) {
            const timelineContainer = document.getElementById('timelineContainer');
            const metaCourier = document.getElementById('metaCourier');
            const metaStatus = document.getElementById('metaStatus');
            const metaWeight = document.getElementById('metaWeight');
            const metaEstDelivery = document.getElementById('metaEstDelivery');

            metaCourier.innerText = data.courier;
            metaStatus.innerText = data.status;
            metaWeight.innerText = data.weight;
            metaEstDelivery.innerText = data.estDelivery;

            timelineContainer.innerHTML = '';

            data.events.forEach(event => {
                const stateClass = event.current ? 'active' : (event.completed ? 'completed' : '');
                const stepHTML = `
                <div class="timeline-item ${stateClass}">
                    <div class="timeline-line"></div>
                    <div class="timeline-dot"></div>
                    <div>
                        <span class="event-time">${event.time}</span>
                        <h3 class="event-title">${event.title}</h3>
                        <p class="event-details">${event.details}</p>
                    </div>
                </div>`;
                timelineContainer.insertAdjacentHTML('beforeend', stepHTML);
            });
        }

        function showError(message) {
            const timelineContainer = document.getElementById('timelineContainer');
            const metaStatus = document.getElementById('metaStatus');
            const metaWeight = document.getElementById('metaWeight');
            const metaEstDelivery = document.getElementById('metaEstDelivery');
            
            timelineContainer.innerHTML = `
                <div class="error-message" style="margin-top: 10px;">
                    <strong>Error:</strong> ${message}
                </div>`;
            metaStatus.innerText = 'Sync Interrupted';
            metaWeight.innerText = '---';
            metaEstDelivery.innerText = '---';
        }

        // Handle Enter key for search input
        document.getElementById('trackingInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                performTracking();
            }
        });
    </script>
</body>

</html>
